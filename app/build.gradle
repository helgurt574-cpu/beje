plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Play Store yükleme anahtarı: proje kökünde keystore.properties varsa release bununla imzalanır.
// Örnek içerik için PLAY_STORE.md dosyasına bakın. Dosya yoksa debug anahtarı kullanılır.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.example.offlinedikte'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "org.beje.dikte"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            upload {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.upload : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Konuşma modelleri Play Asset Delivery ile isteğe bağlı indirilir (bkz. model_* modülleri).
    assetPacks = [":model_tr", ":model_fa", ":model_ar"]

    bundle {
        // Arayüz dili uygulama içinden değiştirilebildiği için tüm diller her cihazda bulunmalı.
        language {
            enableSplit = false
        }
    }

    androidResources {
        generateLocaleConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
